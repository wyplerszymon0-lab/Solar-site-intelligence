name: Tests

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check app.js && node --check solar-model.js && node --check csv.js && node --check geometry.js && node --check export.js
      - run: node --test
